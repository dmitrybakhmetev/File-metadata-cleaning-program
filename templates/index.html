<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Metadata Cleaner 🛡️</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #2c3e50; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        input[type="file"] {
            display: none;
        }
        .file-upload-btn {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: 600;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .file-upload-btn:hover { background-color: #2980b9; }
        button[type="submit"] {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background-color: #27ae60; }
        #file-name {
            margin-bottom: 20px;
            font-size: 13px;
            color: #e67e22;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>File Metadata Cleaner 🛡️</h1>
        <p>Безопасное удаление EXIF и скрытых метаданных из изображений, PDF и Word.</p>
        
        <form method="POST" enctype="multipart/form-data">
            <label class="file-upload-btn">
                Выберите файл
                <input type="file" name="file" id="file-input" required onchange="showFileName()">
            </label>
            <div id="file-name">Файл не выбран</div>
            <button type="submit">Очистить и скачать</button>
        </form>
    </div>

    <script>
        function showFileName() {
            const input = document.getElementById('file-input');
            const fileNameDiv = document.getElementById('file-name');
            if (input.files.length > 0) {
                fileNameDiv.textContent = "Выбран файл: " + input.files[0].name;
            }
        }
    </script>

</body>
</html>
